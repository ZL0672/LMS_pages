<?xml version="1.0" encoding="UTF-8"?>
<!-- 网站 logo：圆形徽章 + 打开的书本 + 书签丝带（矢量 SVG）。
     如需替换为自己的图片，将本文件换成 logo.png / logo.jpg 后，
     同步修改 index.html、register.html 中 <img src="img/logo.svg"> 的引用路径即可。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a67d8"/>
      <stop offset="0.55" stop-color="#6b46c1"/>
      <stop offset="1" stop-color="#9f7aea"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1fe"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4e9fc"/>
      <stop offset="1" stop-color="#f8f9ff"/>
    </linearGradient>
  </defs>

  <!-- 圆形徽章底 -->
  <circle cx="64" cy="64" r="62" fill="url(#badgeBg)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.35"
          stroke-width="2" stroke-dasharray="4 6"/>

  <!-- 打开的书本：左右两页 -->
  <path d="M64 50 C56 41 45 38 34 40 L34 86 C45 84 56 87 64 96 Z" fill="url(#pageLeft)"/>
  <path d="M64 50 C72 41 83 38 94 40 L94 86 C83 84 72 87 64 96 Z" fill="url(#pageRight)"/>
  <line x1="64" y1="50" x2="64" y2="96" stroke="#b9c3ea" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 书页文字行 -->
  <g stroke="#9aa6d8" stroke-width="2.4" stroke-linecap="round">
    <line x1="41" y1="55" x2="56" y2="58"/>
    <line x1="41" y1="65" x2="56" y2="67"/>
    <line x1="41" y1="75" x2="56" y2="76"/>
    <line x1="72" y1="58" x2="87" y2="55"/>
    <line x1="72" y1="67" x2="87" y2="65"/>
    <line x1="72" y1="76" x2="87" y2="75"/>
  </g>

  <!-- 书签丝带 -->
  <path d="M80 22 L92 22 L92 48 L86 41 L80 48 Z" fill="#f6ad55"/>
  <path d="M80 22 L92 22 L92 27 L80 27 Z" fill="#dd8f2f" opacity="0.5"/>

  <!-- 装饰闪光点 -->
  <circle cx="30" cy="30" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="100" cy="100" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="24" cy="96" r="2" fill="#ffffff" opacity="0.5"/>
</svg>
