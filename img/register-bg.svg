<?xml version="1.0" encoding="UTF-8"?>
<!-- 注册页背景图：书籍主题淡色图案（低透明度，保证表单文字可读）。
     该图仅铺在注册表单卡片区域（见 css/register.css 中 .register-card 的
     background-image / background-position / background-size 设置），不占据整个页面。
     如需替换为自己的图片，更换本文件并同步修改 css/register.css 中的引用路径即可。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="blobA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a67d8"/>
      <stop offset="1" stop-color="#9f7aea"/>
    </linearGradient>
  </defs>

  <!-- 大块柔光斑 -->
  <circle cx="540" cy="70" r="150" fill="url(#blobA)" opacity="0.10"/>
  <circle cx="620" cy="220" r="90" fill="#f093fb" opacity="0.08"/>
  <circle cx="90" cy="360" r="130" fill="#38b2ac" opacity="0.07"/>

  <!-- 右上角：漂浮的小书（背景定位在卡片右上角，此处是视觉主体） -->
  <g opacity="0.18">
    <g transform="translate(470 40) rotate(-12)">
      <rect x="0" y="0" width="56" height="42" rx="5" fill="#5a67d8"/>
      <rect x="5" y="5" width="46" height="32" rx="3" fill="#ffffff"/>
      <line x1="28" y1="5" x2="28" y2="37" stroke="#5a67d8" stroke-width="2.5"/>
    </g>
    <g transform="translate(556 120) rotate(10)">
      <rect x="0" y="0" width="46" height="34" rx="5" fill="#6b46c1"/>
      <rect x="4" y="4" width="38" height="26" rx="3" fill="#ffffff"/>
      <line x1="23" y1="4" x2="23" y2="30" stroke="#6b46c1" stroke-width="2"/>
    </g>
  </g>

  <!-- 底部：书架上的一排书脊 -->
  <g opacity="0.16">
    <rect x="0" y="392" width="640" height="10" rx="5" fill="#4a5568"/>
    <rect x="16" y="330" width="20" height="62" rx="3" fill="#5a67d8"/>
    <rect x="40" y="316" width="24" height="76" rx="3" fill="#38b2ac"/>
    <rect x="68" y="338" width="18" height="54" rx="3" fill="#ed8936"/>
    <g transform="translate(92 336) rotate(12)">
      <rect x="0" y="0" width="20" height="58" rx="3" fill="#e53e3e"/>
    </g>
    <rect x="500" y="326" width="22" height="66" rx="3" fill="#6b46c1"/>
    <rect x="526" y="342" width="18" height="50" rx="3" fill="#3182ce"/>
    <rect x="548" y="318" width="24" height="74" rx="3" fill="#d69e2e"/>
    <g transform="translate(578 334) rotate(-10)">
      <rect x="0" y="0" width="20" height="60" rx="3" fill="#319795"/>
    </g>
    <rect x="604" y="340" width="20" height="52" rx="3" fill="#805ad5"/>
  </g>

  <!-- 左下：一副阅读眼镜 -->
  <g opacity="0.15" stroke="#4a5568" fill="none" stroke-width="4" stroke-linecap="round">
    <circle cx="180" cy="368" r="14"/>
    <circle cx="216" cy="368" r="14"/>
    <path d="M194 366 q4 -6 8 0"/>
    <path d="M166 362 l-10 -6"/>
    <path d="M230 362 l10 -6"/>
  </g>

  <!-- 圆点点缀 -->
  <g fill="#5a67d8" opacity="0.15">
    <circle cx="60" cy="60" r="4"/>
    <circle cx="88" cy="42" r="3"/>
    <circle cx="40" cy="88" r="3"/>
    <circle cx="300" cy="30" r="4"/>
    <circle cx="330" cy="52" r="3"/>
    <circle cx="600" cy="330" r="4"/>
  </g>
</svg>
